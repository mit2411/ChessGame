<!DOCTYPE html>
<html>
<head>
<title>Game Hub - Direct Home</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    background: #111;
    color: white;
    overflow: hidden;
    transition: filter 0.3s;
}
.page {
    display: none;
    width: 100%;
    height: 100vh;
    padding-top: 40px;
    text-align: center;
}
button, input[type=range] {
    padding: 10px;
    margin: 5px;
    font-size: 16px;
    border: none;
    border-radius: 6px;
}
button {
    background: #444;
    color: white;
    cursor: pointer;
}
.game-btn {
    display: block;
    width: 200px;
    padding: 15px;
    margin: 15px auto;
    background: #333;
    border-radius: 10px;
    font-size: 20px;
    text-decoration: none;
    color: white;
}
.board {
    display: grid;
    grid-template-columns: repeat(8, 60px);
    margin: 20px auto;
}
.white { background: #eee; width: 60px; height: 60px; }
.black { background: #444; width: 60px; height: 60px; }
canvas { background:#000; display:none; margin:20px auto; }
.ludo-board { width: 450px; margin: auto; display:none; }

/* Settings panel */
.settings-panel {
    background: #222;
    padding: 20px;
    border-radius: 10px;
    width: 300px;
    margin: 20px auto;
    text-align: left;
}
.settings-panel h3 { margin-top: 0; }
</style>
</head>
<body>

<!-- HOME PAGE -->
<div class="page" id="homePage" style="display:block;">
    <h2 id="userName">Welcome, Player</h2>

    <a class="game-btn" onclick="openChess()">♟ Chess</a>
    <a class="game-btn" onclick="openSnake()">🐍 Snake</a>
    <a class="game-btn" onclick="openLudo()">🎲 Ludo</a>

    <div class="settings-panel">
        <h3>Settings</h3>

        <!-- Sound -->
        <label>Sound: </label>
        <button id="soundBtn">On</button><br>

        <!-- Music -->
        <label>Music: </label>
        <button id="musicBtn">Play</button>
        <input type="range" id="musicVolume" min="0" max="1" step="0.01" value="0.5"><br>

        <!-- Brightness -->
        <label>Brightness: </label>
        <input type="range" id="brightnessSlider" min="50" max="150" value="100"><br>

        <!-- Extra features -->
        <label><input type="checkbox" id="feature1"> Feature 1</label><br>
        <label><input type="checkbox" id="feature2"> Feature 2</label><br>
        <label><input type="checkbox" id="feature3"> Feature 3</label>
    </div>
</div>

<!-- CHESS -->
<div class="page" id="chessPage">
    <h2>Chess</h2>
    <div class="board" id="board"></div>
    <button onclick="goHome()">Back</button>
</div>

<!-- SNAKE -->
<div class="page" id="snakePage">
    <h2>Snake</h2>
    <canvas id="snakeCanvas" width="400" height="400"></canvas>
    <button onclick="stopSnake(); goHome()">Back</button>
</div>

<!-- LUDO -->
<div class="page" id="ludoPage">
    <h2>Ludo</h2>
    <img class="ludo-board" id="ludoImg"
         src="https://upload.wikimedia.org/wikipedia/commons/7/7d/Ludo_board.png">
    <button onclick="goHome()">Back</button>
</div>

<!-- Background music -->
<audio id="bgMusic" loop src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3"></audio>

<script>
/* ---------------- SHOW PAGE ---------------- */
function show(page) {
    document.querySelectorAll(".page").forEach(p => p.style.display = "none");
    document.getElementById(page).style.display = "block";
}

/* ---------------- HOME PAGE FUNCTIONS ---------------- */
function goHome() { show("homePage"); }

/* ---------------- CHESS ---------------- */
function openChess() {
    show("chessPage");
    const board = document.getElementById("board");
    board.innerHTML = "";
    let flip = false;
    for (let i=0;i<8;i++) {
        flip = !flip;
        for (let j=0;j<8;j++) {
            let box = document.createElement("div");
            box.className = flip ? "white" : "black";
            board.appendChild(box);
            flip = !flip;
        }
    }
}

/* ---------------- SNAKE ---------------- */
let snakeInterval;
function openSnake() {
    show("snakePage");
    document.getElementById("snakeCanvas").style.display = "block";
    startSnake();
}
function startSnake() {
    let canvas = document.getElementById("snakeCanvas");
    let ctx = canvas.getContext("2d");
    let px=10, py=10, vx=0, vy=0;
    let ax=15, ay=15;
    let trail=[], tail=5;
    document.onkeydown = e => {
        if(e.keyCode==37) vx=-1, vy=0;
        if(e.keyCode==38) vx=0, vy=-1;
        if(e.keyCode==39) vx=1, vy=0;
        if(e.keyCode==40) vx=0, vy=1;
    };
    snakeInterval = setInterval(() => {
        px+=vx; py+=vy;
        if(px<0) px=19; if(px>19) px=0;
        if(py<0) py=19; if(py>19) py=0;
        ctx.fillStyle="black"; ctx.fillRect(0,0,400,400);
        ctx.fillStyle="lime";
        for(let i=0;i<trail.length;i++){
            ctx.fillRect(trail[i].x*20, trail[i].y*20,18,18);
            if(trail[i].x==px && trail[i].y==py) tail=5;
        }
        trail.push({x:px,y:py});
        while(trail.length>tail) trail.shift();
        if(ax==px && ay==py){ tail++; ax=Math.floor(Math.random()*20); ay=Math.floor(Math.random()*20);}
        ctx.fillStyle="red"; ctx.fillRect(ax*20, ay*20,18,18);
    },100);
}
function stopSnake(){ clearInterval(snakeInterval); }

/* ---------------- LUDO ---------------- */
function openLudo(){ show("ludoPage"); }

/* ---------------- SETTINGS CONTROLS ---------------- */
const soundBtn = document.getElementById("soundBtn");
let soundOn = true;
soundBtn.onclick = () => { 
    soundOn = !soundOn; 
    soundBtn.innerText = soundOn ? "On" : "Off"; 
    console.log("Sound:", soundOn);
}

const musicBtn = document.getElementById("musicBtn");
const bgMusic = document.getElementById("bgMusic");
musicBtn.onclick = () => { 
    if(bgMusic.paused){ bgMusic.play(); musicBtn.innerText="Pause"; }
    else{ bgMusic.pause(); musicBtn.innerText="Play"; }
}
document.getElementById("musicVolume").oninput = e => {
    bgMusic.volume = e.target.value;
}

document.getElementById("brightnessSlider").oninput = e => {
    document.body.style.filter = `brightness(${e.target.value}%)`;
}

/* Extra feature toggles */
document.getElementById("feature1").onchange = e => console.log("Feature1:", e.target.checked);
document.getElementById("feature2").onchange = e => console.log("Feature2:", e.target.checked);
document.getElementById("feature3").onchange = e => console.log("Feature3:", e.target.checked);

</script>
</body>
</html>
